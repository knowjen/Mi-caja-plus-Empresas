<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de empresas - MiCaja+</title>
  <link rel="stylesheet" href="Componentes/formato.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- MENÚ LATERAL (HAMBURGUESA) -->
  <!-- ========================================== -->
  <aside id="menu-lateral">
    <div id="zona_marca">
      <div id="logo">
        <figure>
          <img src="componentes/simbolo_micaja+.png" alt="Logo MiCaja+">
        </figure>
      </div>
      <div id="texto_marca">
        <h2>MiCaja+</h2>
        <p>Gestión Contable</p>
      </div>
    </div>

    <nav id="role__navegacion_interfaces__dashboard_principal__1">
      <p>MENÚ PRINCIPAL</p>
      <ul>
        <li id="role__opc-activa__dashboard_principal__2">
          <a href="dashboard_empresa.html" id="dashboard-empresas">
            <span>Empresas</span>
          </a>
          <ul id="submenu-empresa">
            <li> 
              <a href="informacion_empresa.html" id="info_empresa">
                <span>Información de empresa</span>
              </a>
            </li>
            <li>
              <a href="dashboard_principal.html" id="cambiar_empresa">
                <span>Cambiar de Empresa</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- CONTENEDOR PRINCIPAL DE LA PÁGINA -->
  <div id="role__wrapper-principal__dashboard_principal__3">

    <!-- HEADER SUPERIOR (CON EL BOTÓN HAMBURGUESA) -->
    <header id="barra-superior">
      <div id="role__contenedor-navegacion__dashboard_principal__4">
        <button type="button" id="boton-menu" aria-label="Abrir menú">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6L20 6M4 18L20 18M4 12L20 12" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 id="role__titulo-pagina__dashboard_principal__5">Panel de empresas</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
      </div>
    </header>

    <!-- CONTENEDOR DE CONTENIDO -->
    <main id="contenedor-principal">

      <!-- TARJETA SUPERIOR DE SELECCIÓN -->
      <section id="role__tarjetas__tarjeta-seleccion-superior__dashboard_principal__6">
        <div>
          <h2 style="font-size: 1.25rem; margin-bottom: 0.25rem; color: var(--azul-nocturno);" id="role__titulo-bloque__dashboard_principal__7">Selecciona una empresa</h2>
          <p style="font-size: 0.875rem; color: var(--azul-oceano);">Elige la empresa que deseas consultar o administrar</p>
        </div>
        <a href="crear_empresa.html" style="text-decoration: none; padding: 10px 18px; font-size: 13.5px;" id="role__boton-principal__dashboard_principal__8">
          + Crear empresa
        </a>
      </section>

      <!-- BARRA DE BÚSQUEDA -->
      <div id="role__campo-busqueda-contenedor__dashboard_principal__9">
        <input type="text" id="buscador-empresas" placeholder="Buscar por nombre de empresa o NIT..." autocomplete="off">
      </div>

      <!-- LISTA DINÁMICA (Aquí el JS inyectará las empresas que traiga el backend) -->
      <div id="contenedor-empresas">
        <div style="text-align: center; color: var(--azul-oceano); padding: 2rem;" id="role__tarjetas__dashboard_principal__10">
          Cargando empresas desde el servidor...
        </div>
      </div>

    </main>

  </div>

  <!-- Script que controla el menú hamburguesa y el Fetch del backend -->
  <script src="Componentes/funciones.js"></script>
  <script src="Componentes/menu.js"></script>
</body>
</html>
